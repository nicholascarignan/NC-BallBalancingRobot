; BallBalanceRobot - PlatformIO project
; Arduino Uno R3 / ATmega328P
;
; Libraries:
;   Adafruit TouchScreen 1.1.6 - 4-wire resistive touchscreen
;   Brett Beauregard PID 1.2.1 - PID controller
;   Arduino Servo 1.3.0 - standard hobby servo PWM
;
; PlatformIO uses src/main.cpp as the application entry point for
; Arduino-framework projects.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit TouchScreen@^1.1.6
    br3ttb/PID@^1.2.1
    arduino-libraries/Servo@^1.3.0
